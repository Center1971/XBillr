<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBillr - Anmeldung</title>
    <link rel="icon" type="image/png" href="images/xbillr_favicon.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #1976d2;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1976d2;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-button {
            width: 100%;
            padding: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-button:hover {
            background: #1565c0;
        }
        
        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <picture>
                <source srcset="images/xbillr_logo.svg" type="image/svg+xml">
                <img src="images/xbillr_logo.png" alt="XBillr" style="max-width: 200px; height: auto; margin-bottom: 10px;">
            </picture>
            <p>Rechnungsverwaltung</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div style="text-align: center;">
            <button class="login-button" id="loginButton" onclick="initiateLogin()">
                Bei SME Tools anmelden
            </button>
        </div>
    </div>
    
    <script>
        // Global config loaded from backend. In dev (frontend on :8082), API is on :3002 –
        // use backend URL immediately so login redirect always hits the backend (Keycloak), not the static server.
        const isFrontendDevServer = (window.location.port === '8082' || window.location.port === '8080' || window.location.port === '8081') && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        let API_BASE = isFrontendDevServer ? 'http://localhost:3002/api' : '/api';
        let appConfig = null;
        
        function isDevelopmentMode() {
            return window.location.port === '8082' || window.location.hostname === 'localhost';
        }
        
        function getConfigUrl() {
            if (isDevelopmentMode() && (window.location.port === '8082' || window.location.port === '8080' || window.location.port === '8081')) {
                return 'http://localhost:3002/api/config';
            }
            return '/api/config';
        }
        
        async function loadConfig() {
            try {
                const configUrl = getConfigUrl();
                console.log('Loading config from:', configUrl);
                const response = await fetch(configUrl);
                if (response.ok) {
                    appConfig = await response.json();
                    API_BASE = appConfig.apiBaseUrl || API_BASE;
                    console.log('Loaded config:', { apiBaseUrl: API_BASE });
                } else {
                    console.warn('Config endpoint returned:', response.status);
                    if (isFrontendDevServer) {
                        API_BASE = 'http://localhost:3002/api';
                    }
                }
            } catch (error) {
                console.warn('Failed to load config:', error);
                if (isFrontendDevServer) {
                    API_BASE = 'http://localhost:3002/api';
                }
            }
        }
        
        // Check if already logged in by testing the session
        async function checkSession() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include', // Important: include cookies
                });
                
                if (response.ok) {
                    // Already logged in, redirect to main app
                    window.location.href = 'index.html';
                }
            } catch (error) {
                // Not logged in or error, stay on login page
                console.log('No active session');
            }
        }
        
        // Auth login URL: must always hit the backend (which redirects to IAM/Keycloak), never the static frontend server.
        function getAuthLoginUrl() {
            const returnTo = new URLSearchParams(window.location.search).get('return_to') || '/index.html';
            const params = `return_to=${encodeURIComponent(returnTo)}`;
            if (isFrontendDevServer) {
                return `http://localhost:3002/api/auth/login?${params}`;
            }
            const base = API_BASE.startsWith('http') ? API_BASE : (window.location.origin + (API_BASE.startsWith('/') ? '' : '/') + API_BASE);
            return `${base.replace(/\/$/, '')}/auth/login?${params}`;
        }
        
        // Initiate OAuth2/OIDC login flow (always via configured IAM / Keycloak)
        async function initiateLogin() {
            const loginButton = document.getElementById('loginButton');
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="loading"></span> Weiterleitung zu SME Tools Login...';
            if (!appConfig) await loadConfig();
            window.location.href = getAuthLoginUrl();
        }
        
        // Initialize app: load config, then check session
        async function init() {
            await loadConfig();
            await checkSession();
        }
        
        // Start initialization on page load
        init();
    </script>
</body>
</html>
