version: '3.8'

# Produktions-Konfiguration für XBillr
# Verwendung: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      # In Produktion sollten diese aus einem Secret-Manager kommen
      DB_PASSWORD: ${DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Keine Ports nach außen in Produktion (nur über Reverse Proxy)
    # ports:
    #   - "3002:3002"

  mariadb:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Keine Ports nach außen in Produktion
    # ports:
    #   - "3397:3306"
    command: >
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --query-cache-size=64M

