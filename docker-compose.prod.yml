# Produktions-Konfiguration für XBillr
# Verwendung: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      # In Produktion sollten diese aus einem Secret-Manager kommen
      DB_PASSWORD: ${DB_PASSWORD:-u9UUgy2ZwASrTebZ8pAGaCPnVSJZ8NRX}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3002,http://localhost:8082,http://127.0.0.1:3002,http://127.0.0.1:8082,https://xbillr.hurin.com,https.//xbillr.hurin.com:3002,https://xbillr.eu,https://xbillr.eu:3002,file://}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Keine Ports nach außen in Produktion (nur über Reverse Proxy)
    ports:
      - "${BACKEND_PORT:-3002}:3002"

  mariadb:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Keine Ports nach außen in Produktion
    # ports:
    #   - "3397:3306"
    ports:
      - "${DB_PORT:-3397}:3306"
    command: >
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --query-cache-size=64M

