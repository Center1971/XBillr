services:
  mariadb:
    image: mariadb:10.11
    container_name: xbillr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: xbillr
      MYSQL_USER: ${DB_USER:-xbillr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xbillr_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xbillr-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_DSN: "dbi:MariaDB:database=xbillr;host=mariadb;port=3306"
      DB_USER: ${DB_USER:-xbillr_user}
      DB_PASSWORD: ${DB_PASSWORD:-xbillr_pass}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/log:/app/log
      - ./backend/xbillr.conf:/app/xbillr.conf:ro
    healthcheck:
      test: ["CMD", "perl", "-e", "use LWP::Simple; exit(get('http://localhost:3001/api/health') ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mariadb_data:
    driver: local

