<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1976d2">
    <meta http-equiv="refresh" content="0;url=https://www.xbillr.eu/app/">
    <title>XBillr</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #091638;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .loader {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #FABC3D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #FABC3D; }
        .sync-note {
            font-size: 0.8rem;
            opacity: 0.95;
            max-width: 280px;
            margin: 0.75rem auto 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>XBillr wird geladen …</p>
        <p class="sync-note">Alle Eingaben werden mit <strong>www.xbillr.eu</strong> gespeichert und sind sofort auf allen Geräten verfügbar.</p>
        <p style="font-size: 0.85rem; margin-top: 1rem;">Falls keine Weiterleitung erfolgt, <a href="https://www.xbillr.eu/app/">hier tippen</a>.</p>
    </div>
    <script>
        (function() {
            var target = 'https://www.xbillr.eu/app/';
            if (!window.Capacitor || window.location.href.indexOf('xbillr.eu') !== -1) return;
            window.location.replace(target);
        })();
    </script>
</body>
</html>
