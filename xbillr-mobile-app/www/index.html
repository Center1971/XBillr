<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#091638">
  <title>XBillr</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="offline-banner" class="offline-banner">Offline – Änderungen werden lokal gespeichert und später synchronisiert.</div>

  <div id="login-screen" class="login-screen" hidden>
    <h1>XBillr</h1>
    <p>Rechnungen &amp; Kunden – auch offline.</p>
    <button id="btn-login" class="btn" style="margin-top:24px">Anmelden</button>
    <p id="login-error" class="muted" style="color:#fda29b;margin-top:16px"></p>
  </div>

  <div id="app-shell" hidden>
    <header class="app-header">
      <span class="brand">XBillr</span>
      <h1 id="page-title">Rechnungen</h1>
      <button id="btn-logout" class="btn secondary" style="padding:6px 10px;font-size:0.8rem">Logout</button>
    </header>
    <nav class="nav" id="main-nav">
      <button data-page="invoices" class="active">Rechnungen</button>
      <button data-page="customers">Kunden</button>
      <button data-page="stammdaten">Stammdaten</button>
      <button data-page="profile">Profil</button>
    </nav>
    <main>
      <section id="page-invoices" class="page active"></section>
      <section id="page-customers" class="page"></section>
      <section id="page-stammdaten" class="page"></section>
      <section id="page-profile" class="page"></section>
      <section id="page-detail" class="page"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
