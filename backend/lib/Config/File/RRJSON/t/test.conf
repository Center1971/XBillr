# the main section
# multiline comment
main
{
path  =  /usr/local/photos
arrayvar = 1
arrayvar = 2
}

# the photos section
photos
{
ppath  =  $path:/home/jeff/bin:/usr/local/java/bin:/home/jeff/.dist/bin:/sbin:/bin:/usr/sbin:/usr/bin:/usr/X11R6/bin:/usr/local/sbin:/usr/local/bin:/usr/games:./photos
}

# the home section
home
{
jeff  =  ~
}

# the options
options
{
# could be +verbose|1/-verbose|0 (default: 1)
+verbose
# could be +debug|1/-debug|0 (default: 1)
debug    =  1
install
}

# command line section
[cmdline]
# the name of the application
app  =  1
# the name of the library
lib  =  1

# include section
[include]
# the included section
@options
add_options = 0
