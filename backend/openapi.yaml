components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.hurin.com/realms/xbillr/protocol/openid-connect/auth
          tokenUrl: https://keycloak.hurin.com/realms/xbillr/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
            profile: User profile
            email: User email
      description: >-
        PKCE is required for mobile clients. Use S256 code challenge.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
          nullable: true
        name:
          type: string
        address:
          type: string
        zipCode:
          type: string
        city:
          type: string
        country:
          type: string
        email:
          type: string
          nullable: true
        paymentTerms:
          type: integer
          nullable: true
        defaultHourlyRate:
          type: number
          nullable: true
        defaultDailyRate:
          type: number
          nullable: true
        taxRate:
          type: number
          nullable: true
        reverseCharge:
          type: boolean
      required:
        - name
        - address
        - zipCode
        - city

    Invoice:
      type: object
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        customerId:
          type: string
        customerName:
          type: string
          nullable: true
        dateFrom:
          type: string
        dateTo:
          type: string
        subtotal:
          type: number
        taxRate:
          type: number
        taxAmount:
          type: number
        total:
          type: number
        taxType:
          type: string
        status:
          type: string
        paymentTerms:
          type: integer
          nullable: true
        dueDate:
          type: string
          nullable: true
        xrechnungXml:
          type: string
          nullable: true
        archived:
          type: integer
        archivedAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - customerId

    InvoiceUpdate:
      type: object
      properties:
        invoiceNumber:
          type: string
        customerId:
          type: string
        dateFrom:
          type: string
        dateTo:
          type: string
        subtotal:
          type: number
        taxRate:
          type: number
        taxAmount:
          type: number
        total:
          type: number
        taxType:
          type: string
        status:
          type: string
        paymentTerms:
          type: integer
        dueDate:
          type: string

    InvoiceItem:
      type: object
      properties:
        id:
          type: string
        invoiceId:
          type: string
        timeEntryId:
          type: string
        description:
          type: string
        hours:
          type: number
        rate:
          type: number
        amount:
          type: number
        rateType:
          type: string

    TimeEntry:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        hourlyRateId:
          type: string
        date:
          type: string
        hours:
          type: number
        description:
          type: string
        week:
          type: integer
        year:
          type: integer
        createdAt:
          type: string

    HourlyRate:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        rate:
          type: number
        rateType:
          type: string
        description:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
          nullable: true
        createdAt:
          type: string

    Supplier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        zipCode:
          type: string
        city:
          type: string
        country:
          type: string
        taxId:
          type: string
          nullable: true
        vatId:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        bankAccount:
          type: string
          nullable: true
        bankName:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        defaultTaxRate:
          type: number
          nullable: true

    Timesheet:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        dateFrom:
          type: string
        dateTo:
          type: string
        description:
          type: string
          nullable: true
        archived:
          type: integer
        archivedAt:
          type: string
          nullable: true
        createdAt:
          type: string

    LogEntry:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        details:
          type: string
        createdAt:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
